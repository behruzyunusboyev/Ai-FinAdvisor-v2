version: "3.9"

services:
  # PostgreSQL Ma'lumotlar Bazasi
  db:
    image: postgres:16-alpine
    container_name: finadvisor-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (kesh va navbat uchun)
  redis:
    image: redis:7-alpine
    container_name: finadvisor-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finadvisor-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      UZB_VAT_RATE: ${UZB_VAT_RATE}
      UZB_PROFIT_TAX_RATE: ${UZB_PROFIT_TAX_RATE}
      UZB_INCOME_TAX_RATE: ${UZB_INCOME_TAX_RATE}
      UZB_SOCIAL_TAX_RATE: ${UZB_SOCIAL_TAX_RATE}
      UZB_TURNOVER_TAX_RATE: ${UZB_TURNOVER_TAX_RATE}
      UZB_SIMPLIFIED_VAT_RATE: ${UZB_SIMPLIFIED_VAT_RATE}
      UZB_BASE_CALCULATION_AMOUNT: ${UZB_BASE_CALCULATION_AMOUNT}
      UZB_TURNOVER_TAX_LIMIT_BHM: ${UZB_TURNOVER_TAX_LIMIT_BHM}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      PAYME_MERCHANT_ID: ${PAYME_MERCHANT_ID:-}
      PAYME_MERCHANT_LOGIN: ${PAYME_MERCHANT_LOGIN:-}
      PAYME_MERCHANT_KEY: ${PAYME_MERCHANT_KEY:-}
      PAYME_SUBSCRIPTION_PRICE_TIYIN: ${PAYME_SUBSCRIPTION_PRICE_TIYIN:-}
      PAYME_SUBSCRIPTION_PERIOD_DAYS: ${PAYME_SUBSCRIPTION_PERIOD_DAYS:-}
      PAYME_SUBSCRIPTION_PLAN_CODE: ${PAYME_SUBSCRIPTION_PLAN_CODE:-configured}
      PAYME_CHECKOUT_URL: ${PAYME_CHECKOUT_URL:-https://checkout.paycom.uz}
      PAYME_RETURN_URL: ${PAYME_RETURN_URL:-}
      READINESS_WEIGHT_CAPEX: ${READINESS_WEIGHT_CAPEX:-10}
      READINESS_WEIGHT_OPEX: ${READINESS_WEIGHT_OPEX:-20}
      READINESS_WEIGHT_SALES_TAX: ${READINESS_WEIGHT_SALES_TAX:-20}
      READINESS_WEIGHT_INVESTMENT_ROI: ${READINESS_WEIGHT_INVESTMENT_ROI:-20}
      READINESS_WEIGHT_LOAN: ${READINESS_WEIGHT_LOAN:-20}
      READINESS_WEIGHT_TAX_OUTPUT: ${READINESS_WEIGHT_TAX_OUTPUT:-10}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app  # hot-reload uchun

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: finadvisor-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
